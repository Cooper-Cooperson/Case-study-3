name: Terraform Destroy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: ${{ secrets.PROJECT_ID }}
      PROJECT_NUMBER: ${{ secrets.PROJECT_NUMBER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create tfvars file
        run: |
         cat <<EOF > terraform.tfvars
         project_id = "${{ secrets.PROJECT_ID }}"
         region = "${{ secrets.REGION }}"
         zone = "${{ secrets.ZONE }}"
         service_account = "${{ secrets.SERVICE_ACCOUNT }}"
         school_ip = "${{ secrets.SCHOOL_IP }}"
         email = "${{ secrets.EMAIL }}"
         db_name = "${{ secrets.DB_NAME }}"
         db_user = "${{ secrets.DB_USER }}"
         db_password = "${{ secrets.DB_PASSWORD }}"
         project_number = "${{ secrets.PROJECT_NUMBER }}"
         EOF

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "terraform@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        
      - name: Terraform Destroy
        run: terraform destroy -auto-approve 
