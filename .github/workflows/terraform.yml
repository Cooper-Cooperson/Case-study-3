name: Terraform

on: workflow_dispatch

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    
    env:
      PROJECT_ID: ${{ secrets.PROJECT_ID }}
      PROJECT_NUMBER: ${{ secrets.PROJECT_NUMBER }}
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create tfvars file
        run: |
         cat <<EOF > terraform.tfvars
         project_id = "${{ secrets.PROJECT_ID }}"
         region = "europe-west1"
         zone = "europe-west1-4"
         service_account = "terraform@project-96521d1d-c0a7-4c19-b4c.iam.gserviceaccount.com"
         EOF

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "terraform@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
            terraform_wrapper: false  

      - name: Terraform Init
        run: terraform init 

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
